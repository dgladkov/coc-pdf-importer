name: Release latest

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Patch module.json for rolling release
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          m.version = `1.0.${process.env.GITHUB_RUN_NUMBER}`;
          m.manifest =
            'https://github.com/dgladkov/coc-pdf-importer/releases/latest/download/module.json';
          m.download =
            'https://github.com/dgladkov/coc-pdf-importer/releases/latest/download/module.zip';
          fs.writeFileSync('module.json', JSON.stringify(m, null, 2) + '\n');
          console.log(`version=${m.version}`);
          EOF

      - run: npm run build:module

      - uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          artifacts: build/module.zip,build/module.json
          body: |
            Rolling build from `main` @ ${{ github.sha }}
            Version `1.0.${{ github.run_number }}`
